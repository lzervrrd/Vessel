<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vessel Log — Sea Runner</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { margin:0; background:#0a0f1a; color:#e2e8f0; font-family:'Courier New', monospace; }
  input, select, textarea, button { font-family:inherit; }
  * { box-sizing:border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ─── YOUR AIRTABLE BASE (safe to be public — these are just IDs, not secrets) ──
const BASE = "appCee7vxeepE36Qw";
const TABLES = {
  trips:   "tbleTAeXM8XjmCapU",
  fillups: "tbl3vnAiUAEJEXQyR",
  expenses:"tblJV5Fvz9WJeJEFh",
};
const OWNERS = ["Bob", "Jamie", "Tucker"];
const CATS = ["Maintenance","Engine","Electrical","Safety","Registration","Moorage","Other"];

// en-dash field names from the base
const F = {
  gasOwed: (o) => `${o} \u2013 Gas Owed`,
  gasPaid: (o) => `${o} \u2013 Gas Paid`,
  expNet:  (o) => `${o} \u2013 Net`,
};

// ─── TOKEN (kept in this browser only; never in the repo) ──────────────────
function getToken() { return localStorage.getItem("vessel_pat") || ""; }
function setToken(t) { localStorage.setItem("vessel_pat", t); }
function clearToken() { localStorage.removeItem("vessel_pat"); }

// ─── AIRTABLE API ──────────────────────────────────────────────────────────
async function atListAll(tableId) {
  const token = getToken();
  let records = [], offset;
  do {
    const url = new URL(`https://api.airtable.com/v0/${BASE}/${tableId}`);
    url.searchParams.set("pageSize", "100");
    if (offset) url.searchParams.set("offset", offset);
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const data = await res.json();
    records = records.concat(data.records);
    offset = data.offset;
  } while (offset);
  return records;
}

async function atCreate(tableId, fields) {
  const token = getToken();
  const res = await fetch(`https://api.airtable.com/v0/${BASE}/${tableId}`, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ typecast: true, records: [{ fields }] }),
  });
  if (!res.ok) throw new Error(`${res.status} — ${(await res.text()).slice(0,200)}`);
  return res.json();
}

const sum = (rows, key) => rows.reduce((s, r) => s + (Number(r.fields[key]) || 0), 0);
const $m = (n) => Math.round(n).toLocaleString();

// ─── TOKEN SETUP SCREEN ─────────────────────────────────────────────────────
function Setup({ onSaved }) {
  const [val, setVal] = useState("");
  return (
    <div style={S.setupWrap}>
      <div style={S.setupCard}>
        <div style={S.headerTitle}>VESSEL LOG</div>
        <p style={{ color:"#94a3b8", fontSize:13, lineHeight:1.6 }}>
          Paste your Airtable personal access token. It's stored only in this browser —
          it never gets uploaded or shared. Each crew member pastes it once on their own device.
        </p>
        <input style={S.input} type="password" value={val} placeholder="pat..."
          onChange={(e) => setVal(e.target.value)} />
        <button style={{ ...S.btnPrimary, marginTop:12, width:"100%" }}
          onClick={() => { if (val.trim()) { setToken(val.trim()); onSaved(); } }}>
          Save & Connect
        </button>
      </div>
    </div>
  );
}

// ─── ADD FORMS ───────────────────────────────────────────────────────────────
function TripForm({ onDone }) {
  const [f, setF] = useState({ name:"Day Trip", date:new Date().toISOString().slice(0,10), who:[], gal:"", short:false, notes:"" });
  const [busy, setBusy] = useState(false);
  const toggle = (o) => setF(s => ({ ...s, who: s.who.includes(o) ? s.who.filter(x=>x!==o) : [...s.who, o] }));
  const save = async () => {
    if (!f.name || !f.who.length) return;
    setBusy(true);
    try {
      await atCreate(TABLES.trips, {
        "Trip Name": f.name, "Date": f.date, "Who Went": f.who,
        "Estimated Gallons": f.short ? 0 : parseFloat(f.gal || 0),
        "Short Trip (no gas)": f.short, "Notes": f.notes,
      });
      onDone();
    } catch (e) { alert("Save failed: " + e.message); setBusy(false); }
  };
  return (
    <div style={S.form}>
      <label style={S.lab}>Trip Name</label>
      <input style={S.input} value={f.name} onChange={e=>setF({...f,name:e.target.value})} />
      <label style={S.lab}>Date</label>
      <input style={S.input} type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})} />
      <label style={S.lab}>Who Went</label>
      <div style={S.row}>{OWNERS.map(o=>(
        <button key={o} onClick={()=>toggle(o)} style={{...S.tog, ...(f.who.includes(o)?S.togOn:{})}}>{o}</button>
      ))}</div>
      <label style={{...S.lab, display:"flex", alignItems:"center", gap:8, marginTop:8}}>
        <input type="checkbox" checked={f.short} onChange={e=>setF({...f,short:e.target.checked})} /> Short trip (no gas charge)
      </label>
      {!f.short && <>
        <label style={S.lab}>Estimated Gallons</label>
        <input style={S.input} type="number" value={f.gal} onChange={e=>setF({...f,gal:e.target.value})} />
      </>}
      <label style={S.lab}>Notes</label>
      <input style={S.input} value={f.notes} onChange={e=>setF({...f,notes:e.target.value})} />
      <button style={{...S.btnPrimary, marginTop:10}} disabled={busy} onClick={save}>{busy?"Saving…":"Log Trip"}</button>
    </div>
  );
}

function FillupForm({ onDone }) {
  const [f, setF] = useState({ date:new Date().toISOString().slice(0,10), paidBy:"", gal:"", cost:"", notes:"" });
  const [busy, setBusy] = useState(false);
  const save = async () => {
    if (!f.paidBy || !f.gal || !f.cost) return;
    setBusy(true);
    try {
      await atCreate(TABLES.fillups, {
        "Date": f.date, "Paid By": f.paidBy,
        "Gallons": parseFloat(f.gal), "Total Cost": parseFloat(f.cost), "Notes": f.notes,
      });
      onDone();
    } catch (e) { alert("Save failed: " + e.message); setBusy(false); }
  };
  return (
    <div style={S.form}>
      <label style={S.lab}>Date</label>
      <input style={S.input} type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})} />
      <label style={S.lab}>Paid By</label>
      <div style={S.row}>{OWNERS.map(o=>(
        <button key={o} onClick={()=>setF({...f,paidBy:o})} style={{...S.tog, ...(f.paidBy===o?S.togOn:{})}}>{o}</button>
      ))}</div>
      <label style={S.lab}>Gallons</label>
      <input style={S.input} type="number" value={f.gal} onChange={e=>setF({...f,gal:e.target.value})} />
      <label style={S.lab}>Total Cost ($)</label>
      <input style={S.input} type="number" value={f.cost} onChange={e=>setF({...f,cost:e.target.value})} />
      <label style={S.lab}>Notes</label>
      <input style={S.input} value={f.notes} onChange={e=>setF({...f,notes:e.target.value})} />
      <button style={{...S.btnPrimary, marginTop:10}} disabled={busy} onClick={save}>{busy?"Saving…":"Log Fill-Up"}</button>
    </div>
  );
}

function ExpenseForm({ onDone }) {
  const [f, setF] = useState({ desc:"", cat:"Maintenance", date:new Date().toISOString().slice(0,10), cost:"", paidBy:"", split:[...OWNERS] });
  const [busy, setBusy] = useState(false);
  const toggle = (o) => setF(s => ({ ...s, split: s.split.includes(o) ? s.split.filter(x=>x!==o) : [...s.split, o] }));
  const save = async () => {
    if (!f.desc || !f.cost || !f.paidBy) return;
    setBusy(true);
    try {
      await atCreate(TABLES.expenses, {
        "Description": f.desc, "Category": f.cat, "Date": f.date,
        "Total Cost": parseFloat(f.cost), "Paid By": f.paidBy,
        "Split Among": f.split.length ? f.split : OWNERS,
      });
      onDone();
    } catch (e) { alert("Save failed: " + e.message); setBusy(false); }
  };
  return (
    <div style={S.form}>
      <label style={S.lab}>Type</label>
      <div style={{...S.row, flexWrap:"wrap"}}>{CATS.map(c=>(
        <button key={c} onClick={()=>setF({...f,cat:c})} style={{...S.tog, flex:"none", ...(f.cat===c?S.togOn:{})}}>{c}</button>
      ))}</div>
      <label style={S.lab}>Description</label>
      <input style={S.input} value={f.desc} onChange={e=>setF({...f,desc:e.target.value})} />
      <label style={S.lab}>Date</label>
      <input style={S.input} type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})} />
      <label style={S.lab}>Total Cost ($)</label>
      <input style={S.input} type="number" value={f.cost} onChange={e=>setF({...f,cost:e.target.value})} />
      <label style={S.lab}>Paid By</label>
      <div style={S.row}>{OWNERS.map(o=>(
        <button key={o} onClick={()=>setF({...f,paidBy:o})} style={{...S.tog, ...(f.paidBy===o?S.togOn:{})}}>{o}</button>
      ))}</div>
      <label style={S.lab}>Split Among</label>
      <div style={S.row}>{OWNERS.map(o=>(
        <button key={o} onClick={()=>toggle(o)} style={{...S.tog, ...(f.split.includes(o)?S.togOn:{})}}>{f.split.includes(o)?"✓ ":""}{o}</button>
      ))}</div>
      <button style={{...S.btnPrimary, marginTop:10}} disabled={busy} onClick={save}>{busy?"Saving…":"Log Expense"}</button>
    </div>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const [hasToken, setHasToken] = useState(!!getToken());
  const [data, setData] = useState({ trips:[], fillups:[], expenses:[] });
  const [tab, setTab] = useState("trips");
  const [adding, setAdding] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);

  const load = async () => {
    setLoading(true); setErr(null);
    try {
      const [trips, fillups, expenses] = await Promise.all([
        atListAll(TABLES.trips), atListAll(TABLES.fillups), atListAll(TABLES.expenses),
      ]);
      setData({ trips, fillups, expenses });
    } catch (e) {
      setErr(e.message);
      if (String(e.message).startsWith("401")) { clearToken(); setHasToken(false); }
    }
    setLoading(false);
  };

  useEffect(() => { if (hasToken) load(); }, [hasToken]);

  if (!hasToken) return <Setup onSaved={() => setHasToken(true)} />;

  // balances straight from the base's formula fields
  const balances = OWNERS.map(o => {
    const gasNet = sum(data.fillups, F.gasPaid(o)) - sum(data.trips, F.gasOwed(o));
    const expNet = sum(data.expenses, F.expNet(o));
    return { owner:o, gasNet, expNet, total: gasNet + expNet };
  });

  const Form = tab === "trips" ? TripForm : tab === "fillups" ? FillupForm : ExpenseForm;
  const rows = data[tab];

  return (
    <div style={S.app}>
      <div style={S.header}>
        <span style={S.boat}>⚓</span>
        <div style={{ flex:1 }}>
          <div style={S.headerTitle}>VESSEL LOG</div>
          <div style={S.sub}>Bob · Jamie · Tucker · Sea Runner</div>
        </div>
        <button style={S.ghost} onClick={load}>↻</button>
        <button style={S.ghost} onClick={()=>{ clearToken(); setHasToken(false); }}>⏏ token</button>
      </div>

      <div style={S.cards}>
        {balances.map(b => (
          <div key={b.owner} style={S.card}>
            <div style={S.cardName}>{b.owner}</div>
            <div style={S.cRow}><span style={S.mini}>Gas</span><span style={{color:b.gasNet>=0?"#4ade80":"#f87171"}}>{b.gasNet>=0?"+":""}${$m(b.gasNet)}</span></div>
            <div style={S.cRow}><span style={S.mini}>Shared</span><span style={{color:b.expNet>=0?"#4ade80":"#f87171"}}>{b.expNet>=0?"+":""}${$m(b.expNet)}</span></div>
            <div style={S.div} />
            <div style={S.cRow}><span style={S.mini}>NET</span><span style={{fontWeight:700, color:b.total>=0?"#4ade80":"#f87171"}}>{b.total>=0?"+":""}${$m(b.total)}</span></div>
          </div>
        ))}
      </div>

      <div style={S.tabs}>
        {[["trips","TRIPS"],["fillups","FILL-UPS"],["expenses","EXPENSES"]].map(([k,l])=>(
          <button key={k} onClick={()=>{setTab(k); setAdding(false);}} style={{...S.tab, ...(tab===k?S.tabOn:{})}}>{l}</button>
        ))}
      </div>

      <div style={{ padding:"16px 20px" }}>
        <button style={S.btnAdd} onClick={()=>setAdding(a=>!a)}>{adding?"× Close":"+ Add"}</button>
        {adding && <Form onDone={()=>{ setAdding(false); load(); }} />}

        {err && <div style={S.err}>Error: {err}</div>}
        {loading && <div style={S.empty}>Loading…</div>}
        {!loading && rows.length===0 && <div style={S.empty}>Nothing logged yet.</div>}

        {!loading && rows.map(r => {
          const x = r.fields;
          return (
            <div key={r.id} style={S.entry}>
              {tab==="trips" && <>
                <div style={S.eHead}><b>{x["Trip Name"]}</b>{x["Short Trip (no gas)"] && <span style={S.badge}>SHORT</span>}<span style={S.date}>{x["Date"]}</span></div>
                <div style={S.eMeta}><span>👥 {(x["Who Went"]||[]).join(", ")}</span>{!x["Short Trip (no gas)"] && <span>⛽ ~{x["Estimated Gallons"]} gal · ${$m(x["Est. Gas Cost"]||0)}</span>}</div>
              </>}
              {tab==="fillups" && <>
                <div style={S.eHead}><b>{x["Paid By"]} filled up</b><span style={S.date}>{x["Date"]}</span></div>
                <div style={S.eMeta}><span>⛽ {x["Gallons"]} gal</span><span style={{color:"#4ade80"}}>+${$m(x["Total Cost"]||0)}</span></div>
              </>}
              {tab==="expenses" && <>
                <div style={S.eHead}><b>{x["Description"]}</b><span style={S.badge}>{x["Category"]}</span><span style={S.date}>{x["Date"]}</span></div>
                <div style={S.eMeta}><span>{x["Paid By"]} paid ${$m(x["Total Cost"]||0)}</span><span style={{color:"#94a3b8"}}>${$m(x["Per Person"]||0)}/ea</span></div>
              </>}
            </div>
          );
        })}

        <div style={S.note}>📷 Add photos to any entry from the Airtable mobile app or a public Form — they'll show up here on refresh.</div>
      </div>
    </div>
  );
}

const S = {
  app:{ maxWidth:780, margin:"0 auto" },
  setupWrap:{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:20 },
  setupCard:{ background:"#0f1e35", border:"1px solid #1e3a5f", borderRadius:12, padding:28, width:"min(440px,92vw)" },
  header:{ display:"flex", alignItems:"center", gap:12, padding:"18px 20px", background:"linear-gradient(135deg,#0f1e35,#0a2240)", borderBottom:"1px solid #1e3a5f" },
  boat:{ fontSize:28 },
  headerTitle:{ fontSize:20, fontWeight:700, letterSpacing:3, color:"#7dd3fc" },
  sub:{ fontSize:11, color:"#475569", letterSpacing:1 },
  ghost:{ background:"#0f2a4a", border:"1px solid #1e3a5f", color:"#7dd3fc", borderRadius:8, padding:"6px 10px", fontSize:11, cursor:"pointer" },
  cards:{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, padding:"16px 20px" },
  card:{ background:"#0f1e35", border:"1px solid #1e3a5f", borderRadius:8, padding:"12px 14px" },
  cardName:{ fontSize:13, fontWeight:700, color:"#7dd3fc", marginBottom:8 },
  cRow:{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:4 },
  mini:{ color:"#475569" },
  div:{ borderTop:"1px solid #1e3a5f", margin:"6px 0" },
  tabs:{ display:"flex", padding:"0 20px", borderBottom:"1px solid #1e3a5f" },
  tab:{ background:"none", border:"none", borderBottom:"2px solid transparent", color:"#475569", fontSize:11, letterSpacing:2, padding:"10px 14px", cursor:"pointer" },
  tabOn:{ color:"#7dd3fc", borderBottomColor:"#7dd3fc" },
  btnAdd:{ background:"#0f2a4a", border:"1px solid #1e3a5f", color:"#7dd3fc", fontSize:12, letterSpacing:1, padding:"8px 16px", borderRadius:6, cursor:"pointer", marginBottom:14 },
  form:{ display:"flex", flexDirection:"column", gap:6, background:"#0d1829", border:"1px solid #1e2d40", borderRadius:8, padding:16, marginBottom:16 },
  lab:{ fontSize:10, letterSpacing:1, color:"#475569" },
  input:{ background:"#0a0f1a", border:"1px solid #1e3a5f", borderRadius:6, color:"#e2e8f0", fontSize:13, padding:"8px 10px", width:"100%" },
  row:{ display:"flex", gap:6 },
  tog:{ flex:1, background:"#0a0f1a", border:"1px solid #1e3a5f", color:"#475569", fontSize:12, padding:"7px", borderRadius:6, cursor:"pointer" },
  togOn:{ background:"#0f2a4a", border:"1px solid #7dd3fc", color:"#7dd3fc" },
  btnPrimary:{ background:"#1e4a7a", border:"none", color:"#7dd3fc", fontSize:12, letterSpacing:1, padding:"10px", borderRadius:6, cursor:"pointer" },
  entry:{ background:"#0d1829", border:"1px solid #1e2d40", borderRadius:8, padding:"10px 14px", marginBottom:8 },
  eHead:{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:5, color:"#cbd5e1", fontSize:13 },
  eMeta:{ display:"flex", gap:14, fontSize:11, color:"#64748b", flexWrap:"wrap" },
  date:{ marginLeft:"auto", fontSize:10, color:"#475569" },
  badge:{ fontSize:9, letterSpacing:1, background:"#1e3a5f", color:"#7dd3fc", padding:"2px 6px", borderRadius:4 },
  empty:{ color:"#334155", textAlign:"center", padding:"24px", fontSize:12 },
  err:{ background:"#3b0d0d", border:"1px solid #7f1d1d", color:"#fca5a5", padding:"10px 12px", borderRadius:6, fontSize:12, marginBottom:12 },
  note:{ marginTop:16, fontSize:11, color:"#475569", textAlign:"center", lineHeight:1.6 },
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
